
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    env_file:
      - .env
    environment:
      PORT: ":8080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
